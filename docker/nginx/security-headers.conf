# Browser security policy for every public HTTPS response, including errors.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' wss://*:8181 wss://*:8282 wss://*:8383 wss://*:8484; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
