# Reverse proxy + static file server for production, bind-mounted into the
# `web` service (see docker/compose.prod.yml) so it can be edited on the
# server without rebuilding the frontend image.
#
# - Terminates TLS (see scripts/gen-internal-cert.sh for the certificate).
# - Serves the compiled SPA (frontend/dist, baked into the image).
# - Proxies everything under /api/ to the `api` service, same origin as
#   the SPA — this is why the frontend build needs no VITE_API_BASE_URL.

server {
    listen 80;
    server_name _;

    # Container-internal healthcheck target (docker/compose.prod.yml,
    # service `web`). Deliberately plain HTTP with no redirect: the
    # Docker healthcheck runs `wget` *inside* the container against the
    # self-signed cert in deploy/certs/, and BusyBox wget doesn't
    # reliably validate/follow that TLS hop — hitting this endpoint
    # keeps the healthcheck from depending on TLS at all. Not meant to
    # be reached from outside the container.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Plain HTTP otherwise only exists to redirect: the session cookie is
    # Secure (see backend/app/core/config.py's session_cookie_secure) and
    # won't be sent back over HTTP at all.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA client-side routing (React Router): unknown paths fall back
        # to index.html instead of a raw nginx 404.
        try_files $uri /index.html;
    }

    location = /index.html {
        # Never cache the entry point — it references hashed asset
        # filenames, so a stale cached copy would point at assets that no
        # longer exist after a deploy.
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        # Vite fingerprints these filenames, so a long cache is safe.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
