# Reverse proxy + static file server for production, bind-mounted into the
# `web` service (see docker/compose.prod.yml) so it can be edited on the
# server without rebuilding the frontend image.
#
# - Terminates TLS (see scripts/gen-internal-cert.sh for the certificate).
# - Serves the compiled SPA (frontend/dist, baked into the image).
# - Proxies only /api/v1/ to the `api` service, same origin as the SPA;
#   every other /api/ path is rejected at the perimeter.

server_tokens off;

server {
    # Container-only health port: Compose does not publish 8080 to the host.
    listen 8080;
    server_name localhost;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

server {
    listen 80;
    server_name _;

    # Plain HTTP otherwise only exists to redirect: the session cookie is
    # Secure (see backend/app/core/config.py's session_cookie_secure) and
    # won't be sent back over HTTP at all.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # The largest legitimate body is a <=2 MB JSON-encoded product image.
    client_max_body_size 3m;

    include /etc/nginx/snippets/openerp-security-headers.conf;

    location = /healthz {
        return 404;
    }

    # Host-controlled maintenance flag. It is checked per request in the API
    # and SPA locations below, so the maintenance document itself is exempt.
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
    }

    # Docker's embedded DNS (127.0.0.11) instead of nginx's own resolver:
    # `proxy_pass http://api:8000` with a literal hostname resolves once,
    # at startup, and then nginx keeps using that IP forever — if `api` is
    # later recreated on its own (e.g. `make prod-restart`, which
    # intentionally doesn't touch `web`), it gets a new container IP and
    # this would otherwise proxy into a dead address (502 Bad Gateway)
    # until someone thinks to restart `web` too. Routing proxy_pass
    # through a variable forces nginx to re-resolve on every request
    # (bounded by `valid`), so a lone `api` restart just works.
    resolver 127.0.0.11 valid=10s;

    # Health remains available to Docker and deploy smoke through the API
    # container itself, but is not part of the public HTTP surface.
    location = /api/v1/health/live {
        return 404;
    }

    location = /api/v1/health/ready {
        return 404;
    }

    location /api/v1/ {
        if (-f /run/openerp-maintenance/enabled) {
            return 503;
        }
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # This is the first and only supported public proxy. Never append an
        # Internet-supplied chain: Uvicorn trusts this header only when the
        # socket peer is Nginx's fixed backend-network address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Unknown/non-versioned API paths are never eligible for the SPA fallback.
    location /api/ {
        if (-f /run/openerp-maintenance/enabled) {
            return 503;
        }
        return 404;
    }

    # These would otherwise fall through to React and misleadingly return
    # index.html with status 200.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        if (-f /run/openerp-maintenance/enabled) {
            return 503;
        }
        # SPA client-side routing (React Router): unknown paths fall back
        # to index.html instead of a raw nginx 404.
        try_files $uri /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/openerp-security-headers.conf;
        # Never cache the entry point — it references hashed asset
        # filenames, so a stale cached copy would point at assets that no
        # longer exist after a deploy.
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        include /etc/nginx/snippets/openerp-security-headers.conf;
        # Vite fingerprints these filenames, so a long cache is safe.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
