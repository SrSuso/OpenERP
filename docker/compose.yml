name: openerp

# Development infrastructure only.  The API, the worker and the frontend run on
# the host so reloads are instant; only stateful services live here.
services:
  postgres:
    image: postgres:17.10-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openerp}
      POSTGRES_DB: ${POSTGRES_DB:-openerp}
      # Deterministic collation: sort order must not depend on the host locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      # Surface slow queries during development.
      - -c
      - log_min_duration_statement=500
      - -c
      - max_connections=100
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-openerp} -d ${POSTGRES_DB:-openerp}']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
      - '${MAILPIT_UI_PORT:-8025}:8025' # web UI + REST API used by tests
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/readyz']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
