name: openerp-prod

# Production stack for a single internal server. Contrast with
# docker/compose.yml, which only runs the *dev* infrastructure
# (PostgreSQL + Mailpit) while the API/worker/frontend run on the host;
# here every OpenERP process runs in its own container, and `web`
# terminates TLS in front of everything (see docker/nginx/nginx.conf and
# docs/ADMIN_GUIDE.md).
#
# Usage (from the repo root, or via the `make prod-*` targets):
#   docker compose -f docker/compose.prod.yml --env-file .env.production up -d --wait

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    command:
      - postgres
      - -c
      - max_connections=100
    ports:
      # Bound to the server itself only — never exposed to the LAN.
      # Lets scripts/backup-postgres.sh and scripts/restore-postgres.sh
      # run unchanged from the host against 127.0.0.1.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  # `migrate`, `api` and `worker` intentionally share the same env_file and
  # therefore the same database/runtime source. `prod-bootstrap-admin` runs
  # against the `api` service and inherits it too. Mounted Docker secrets can
  # be referenced with OPENERP_<FIELD>_FILE=/run/secrets/... when required.
  # This one-shot applies Alembic migrations, then exits 0. It protects initial
  # `prod-up`; updates use deploy-update.sh's stricter maintenance/stop/backup
  # sequence and start API/worker with --no-deps only after explicit validation.
  migrate:
    build:
      context: ../backend
    image: openerp-backend:${OPENERP_VERSION:-latest}
    env_file: ../.env.production
    command: ['uv', 'run', 'alembic', 'upgrade', 'head']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ../backend
    image: openerp-backend:${OPENERP_VERSION:-latest}
    env_file: ../.env.production
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --workers
      - '1'
      - --proxy-headers
      - --forwarded-allow-ips
      - ${OPENERP_TRUSTED_PROXY_IP:-172.30.0.10}
    expose:
      - '8000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ../backend
    image: openerp-backend:${OPENERP_VERSION:-latest}
    env_file: ../.env.production
    command: ['uv', 'run', 'python', '-m', 'app.jobs.worker']
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # backend/Dockerfile's HEALTHCHECK hits :8000/api/v1/health/live —
      # correct for `api`, meaningless here: the worker is a polling loop
      # with no HTTP server at all (see app/jobs/worker.py), so that probe
      # would always fail with connection refused. Disable the inherited
      # check for this service instead of reporting a false "unhealthy";
      # its liveness is "is the process still running", which `restart:
      # unless-stopped` + `docker compose ps`/`make prod-logs` already
      # cover without a custom probe.
      disable: true

  web:
    build:
      context: ../frontend
    image: openerp-frontend:${OPENERP_VERSION:-latest}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker/nginx/security-headers.conf:/etc/nginx/snippets/openerp-security-headers.conf:ro
      - ../docker/nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - ../deploy/maintenance:/run/openerp-maintenance:ro
      - ../deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      default:
        # Uvicorn trusts forwarded headers from this address only.
        ipv4_address: ${OPENERP_TRUSTED_PROXY_IP:-172.30.0.10}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:

networks:
  default:
    name: openerp-prod-backend
    ipam:
      config:
        - subnet: ${OPENERP_BACKEND_SUBNET:-172.30.0.0/24}
